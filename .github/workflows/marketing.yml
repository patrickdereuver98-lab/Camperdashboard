# Marketingdashboard (docs/marketing/plan.md):
#   seo   elke nacht: Search Console en PageSpeed naar Supabase
#   jobs  elke 10 minuten: opdrachten uit Studio (filmpjes, schermopnames); maandag ook nieuwe schermopnames
# Geheimen (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL            verbindingsadres van de database (liefst een eigen rol met alleen de marketingtabellen)
#   GSC_SERVICE_ACCOUNT_JSON   JSON-sleutel van het serviceaccount met leesrechten in Search Console (plan §6, P2)
#   PAGESPEED_API_KEY          optioneel; zonder sleutel geldt een lage dagelijkse limiet
#   IG_ACCESS_TOKEN, IG_USER_ID  optioneel: Instagram-cijfers van het eigen zakelijke account (plan §6, P5)
# Ontbreekt een verplicht geheim, dan slaat de run over met een melding (geen rode run elke 10 minuten).
# Variabelen (optioneel): GSC_SITE (standaard sc-domain:vrijstaan.nl), SITE_URL (standaard https://vrijstaan.nl)
name: Marketing

on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "*/10 6-22 * * *"
    - cron: "43 6 * * 1"
  workflow_dispatch:
    inputs:
      onderdeel:
        description: "seo of jobs"
        default: jobs

permissions:
  contents: read

jobs:
  seo:
    if: github.event.schedule == '17 5 * * *' || (github.event_name == 'workflow_dispatch' && inputs.onderdeel == 'seo')
    concurrency:
      group: marketing-seo
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Geheimen aanwezig?
        id: gate
        working-directory: .
        env:
          HAS_DB: ${{ secrets.SUPABASE_DB_URL != '' }}
          HAS_GSC: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON != '' }}
        run: |
          if [ "$HAS_DB" != "true" ] || [ "$HAS_GSC" != "true" ]; then
            echo "::notice::SUPABASE_DB_URL of GSC_SERVICE_ACCOUNT_JSON ontbreekt: Search Console overgeslagen (docs/marketing/plan.md §6)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
      - name: Search Console, PageSpeed en Instagram ophalen
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GSC_SITE: ${{ vars.GSC_SITE }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node --no-warnings --import ./tests/register.mjs scripts/marketing/search-console.ts

  jobs:
    if: github.event.schedule != '17 5 * * *' && (github.event_name != 'workflow_dispatch' || inputs.onderdeel != 'seo')
    concurrency:
      group: marketing-jobs
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web
    steps:
      - name: Geheim aanwezig?
        id: gate
        working-directory: .
        env:
          HAS_DB: ${{ secrets.SUPABASE_DB_URL != '' }}
        run: |
          if [ "$HAS_DB" != "true" ]; then
            echo "::notice::SUPABASE_DB_URL ontbreekt: marketingopdrachten overgeslagen."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Maandag nieuwe schermopnames klaarzetten
        if: steps.gate.outputs.run == 'true' && github.event.schedule == '43 6 * * 1'
        working-directory: .
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -qc "insert into public.marketing_jobs (kind) values ('schermopnames')"
      - name: Opdrachten?
        id: open
        if: steps.gate.outputs.run == 'true'
        working-directory: .
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          n=$(psql "$SUPABASE_DB_URL" -tAc "select count(*) from public.marketing_jobs where status = 'wacht' or (status = 'bezig' and started_at < now() - interval '2 hours')")
          echo "aantal=$n" >> "$GITHUB_OUTPUT"
          echo "$n opdracht(en) open"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true' && steps.open.outputs.aantal != '0'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.run == 'true' && steps.open.outputs.aantal != '0'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pakketten en Chromium
        if: steps.gate.outputs.run == 'true' && steps.open.outputs.aantal != '0'
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Opdrachten uitvoeren
        if: steps.gate.outputs.run == 'true' && steps.open.outputs.aantal != '0'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node --no-warnings --import ./tests/register.mjs scripts/marketing/jobs.ts
