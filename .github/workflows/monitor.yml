# Bewaking zonder externe dienst: faalt deze workflow, dan mailt GitHub de eigenaar van de repository.
# Elk uur:
#   - staat de site online (alleen als de variabele SITE_URL is gezet): elke pagina moet HTTP 200 geven, een
#     doorverwijzing (3xx, bijvoorbeeld naar de Vercel-login) telt als storing;
#   - public.health() (migratie 20261106200000): genoeg plekken online, geen daling van meer dan 2% in plekken, plekken
#     met vertrekregel of met prijs ten opzichte van de vorige run, niet meer dan 20% mislukte aanroepen via pg_net, en
#     een recente scrape (web/scripts/check-health.mjs). De vorige uitkomst staat in de Actions-cache.
name: Bewaking

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bewaking
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      SUPABASE_URL: https://qkrmthrhwmmmwswmfgwc.supabase.co
      SUPABASE_KEY: sb_publishable_EGEUx5L3Df4w18_DgmtbHw_6RUoglht
      MIN_PLEKKEN: "1000"
    steps:
      - name: Site bereikbaar
        if: env.SITE_URL != ''
        run: |
          fail=0
          for path in / /zonder-vertrektijd /sitemap.xml /api/towns; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$SITE_URL$path")
            echo "$path antwoordde met HTTP $code"
            case "$code" in
              200) ;;
              3??) echo "::error::$path stuurt door (HTTP $code): staat de site achter een login of op een ander adres?"; fail=1 ;;
              *) echo "::error::$path antwoordde met HTTP $code"; fail=1 ;;
            esac
          done
          exit "$fail"
      - name: Site-adres nog niet ingesteld
        if: env.SITE_URL == ''
        run: echo "::notice::Zet de repositoryvariabele SITE_URL (Settings → Secrets and variables → Actions → Variables) om ook de site te bewaken."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: web/scripts
          persist-credentials: false
      - name: Vorige uitkomst
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vorige-health.json
          key: health-${{ github.run_id }}
          restore-keys: health-
      - name: Database en kerncijfers (health)
        run: |
          code=$(curl -sS -o health.json -w "%{http_code}" --max-time 30 -X POST \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "Content-Type: application/json" \
            -d '{}' "$SUPABASE_URL/rest/v1/rpc/health")
          echo "health() antwoordde met HTTP $code"
          cat health.json; echo
          test "$code" = "200" || { echo "::error::health() antwoordde met HTTP $code"; exit 1; }
          node web/scripts/check-health.mjs health.json vorige-health.json
      # Ook na een daling: de volgende run vergelijkt met de nieuwe stand, zodat één daling één mail geeft
      - name: Uitkomst bewaren voor de volgende run
        if: always() && hashFiles('health.json') != ''
        run: if grep -q '"published"' health.json; then cp health.json vorige-health.json; fi
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && hashFiles('vorige-health.json') != ''
        with:
          path: vorige-health.json
          key: health-${{ github.run_id }}
