# Controles op pull requests naar acceptatie of main en op elke push daarnaartoe: lint, typecheck, unit tests, een
# build zonder netwerk en E2E-tests (Playwright) op die build. Werkwijze: PR's gaan eerst naar acceptatie (testen op de
# Vercel-preview), daarna naar main.
name: CI

on:
  pull_request:
    branches: [main, acceptatie]
  push:
    branches: [main, acceptatie]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Geen bekende lekken in pakketten van de site
        run: npm audit --omit=dev --audit-level=high
      - name: Build met de snapshot
        run: npm run build:offline
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  data-collectors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r tools/data-collectors/requirements.txt pytest
      - run: python -m pytest -q tools/data-collectors
